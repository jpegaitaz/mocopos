[project]
name = "mocopos"
version = "0.1.0"
description = "Agentic MCP repo scanner (MVP)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "click>=8.1.7,<9",
  "rich",
  "pydantic>=2",
  "python-dotenv",
  "requests",
  "jsonschema",
  "tomli; python_version < '3.11'"
]

[project.scripts]
mcp-scan = "mocopos.cli.main:main"

[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mocopos"]

[tool.ruff]
line-length = 100

[tool.uv]
