[project]
name = "mocopos"
version = "0.1.0"
description = "Agentic MCP repo scanner (MVP)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "click>=8.1.7,<9",
  "rich",
  "pydantic>=2",
  "python-dotenv",
  "requests",
  "jsonschema",
  "tomli; python_version < '3.11'",
  "PyYAML>=6.0.1",
  "yara-python>=4.3",
  "openai>=2.2.0",
  "jinja2>=3.1",
  "markdown>=3.5",
  "weasyprint>=62",
  "markdown-it-py>=3.0",
  "mdit-py-plugins>=0.4",
]

[project.optional-dependencies]
report = ["jinja2>=3.1", "markdown>=3.5", "weasyprint>=62"]

[project.scripts]
mcp-scan = "mocopos.cli.main:main"
mcp-scan-search = "mocopos.cli.discover:main"
mocopos-llm-chat = "mocopos.cli.llm_chat:main"

[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mocopos"]

[tool.ruff]
line-length = 100

[tool.uv]
