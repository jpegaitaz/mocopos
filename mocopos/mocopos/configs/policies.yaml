network:
  # If true, flag requests to private IP ranges
  block_private: true
  # If non-empty, require outbound HTTP domains to match one of these (substring match)
  allowed_domains: ["api.github.com", "slack.com"]

filesystem:
  # Safe root for file ops (if a tool writes outside this, flag)
  safe_root: "/workspace"

ci:
  # Require actions to be pinned to a version or SHA (non-floating)
  require_pinned: true
  # Stronger pin (only full-length SHA allowed). If false, tags like v3 are OK.
  require_sha_pin: false
