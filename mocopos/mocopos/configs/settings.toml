[github]
api_base = "https://api.github.com"
prefer_archive = true

[report]
output_path = "reports/scan_results/single_repo_results.json"

[scanner]
max_bytes_per_file = 500000

# broadened defaults
ignore_globs = [
  "**/.git/**",
  "**/.github/**",
  "**/.vscode/**",
  "**/.idea/**",
  "**/node_modules/**",
  "**/dist/**",
  "**/build/**",
  "**/.venv/**",
  "**/*.min.js",
  "**/*.min.css",
  "**/*.lock",
  "**/*.png",
  "**/*.jpg",
  "**/*.jpeg",
  "**/*.gif",
  "**/*.webp",
  "**/*.pdf",
  "**/*.zip",
  "**/*.tar",
  "**/*.tgz",
  "**/*.gz",
  "**/package-lock.json",
  "**/pnpm-lock.yaml", 
  "**/yarn.lock", 
  "**/*.lock",
  "**/node_modules/**", 
  "**/dist/**", 
  "**/build/**", 
  "**/.next/**", 
  "**/.vite/**",
  "**/docs/**", 
  "**/website/**",
  "**/example/**",
  "**/demo/**",
  "**/*mock*/**",
  "**/*fixtures*/**",
  "**/fixtures/**",
  "**/mocks/**",
  "**/*.spec.ts",
  "**/*.test.ts",
  "**/*.stories.ts*",
]
