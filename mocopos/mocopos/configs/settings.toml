[github]
api_base = "https://api.github.com"

[report]
output_path = "report.json"

[scanner]
max_bytes_per_file = 500000

# broadened defaults
ignore_globs = [
  "**/.git/**",
  "**/.github/**",
  "**/.vscode/**",
  "**/.idea/**",
  "**/node_modules/**",
  "**/dist/**",
  "**/build/**",
  "**/.venv/**",
  "**/*.min.js",
  "**/*.min.css",
  "**/*.lock",
  "**/*.png",
  "**/*.jpg",
  "**/*.jpeg",
  "**/*.gif",
  "**/*.webp",
  "**/*.pdf",
  "**/*.zip",
  "**/*.tar",
  "**/*.tgz",
  "**/*.gz",
]
